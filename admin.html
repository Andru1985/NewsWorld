<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administración | NewsWorld</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/admin.css">

</head>

<body>


<header class="header">

    <div class="container nav-container">

        <a href="index.html" class="logo">

            <span>NW</span>

            NewsWorld

        </a>


        <nav class="nav">

            <a href="index.html">
                Inicio
            </a>

            <a href="noticias.html">
                Noticias
            </a>

            <a href="favoritos.html">
                Favoritos
            </a>

            <a href="contacto.html">
                Contacto
            </a>

        </nav>

    </div>

</header>


<main>

<section class="page-header">

    <div class="container">

        <span>
            NEWSWORLD
        </span>

        <h1>
            Administración
        </h1>

        <p>
            Gestión de noticias.
        </p>

    </div>

</section>


<section class="admin-section">

    <div class="container">


        <div class="admin-header">

            <div>

                <h2>
                    Gestión de noticias
                </h2>

                <p>
                    Crea, consulta y elimina noticias.
                </p>

            </div>


            <button
                id="btnNuevaNoticia"
                class="btn btn-primary">

                + Nueva noticia

            </button>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Título
                        </th>

                        <th>
                            Categoría
                        </th>

                        <th>
                            Fecha
                        </th>

                        <th>
                            Acciones
                        </th>

                    </tr>

                </thead>


                <tbody id="tablaNoticias">

                </tbody>

            </table>

        </div>


        <div
            id="formularioAdmin"
            class="admin-form"
            style="display:none;">

            <h2>
                Nueva noticia
            </h2>


            <form id="formNoticia">

                <div class="form-group">

                    <label>
                        Título
                    </label>

                    <input
                        type="text"
                        id="titulo">

                </div>


                <div class="form-group">

                    <label>
                        Categoría
                    </label>

                    <select id="categoria">

                        <option value="">
                            Seleccionar
                        </option>

                        <option value="Tecnología">
                            Tecnología
                        </option>

                        <option value="Educación">
                            Educación
                        </option>

                        <option value="Turismo">
                            Turismo
                        </option>

                        <option value="Comercio">
                            Comercio
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        rows="5"></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Imagen
                    </label>

                    <input
                        type="text"
                        id="imagen"
                        placeholder="img/tecnologia.jpg">

                </div>


                <div>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Guardar noticia

                    </button>


                    <button
                        type="button"
                        id="cancelarNoticia"
                        class="btn btn-secondary">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

</main>


<footer class="footer">

    <div class="footer-bottom">

        © 2026 NewsWorld

    </div>

</footer>


<script src="js/app.js"></script>

<script src="js/admin.js"></script>

</body>

</html>
